name: n7cosmetics

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/adnanrahim110/n7cosmetics:latest}
    container_name: n7-app
    init: true
    restart: unless-stopped
    env_file: ./app.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DB_HOST: database
      DB_PASSWORD_FILE: /run/secrets/db_password
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
      MEDIA_STORAGE_DIR: /app/media
    secrets: [db_password, app_encryption_key]
    volumes:
      - ./media:/app/media
      - next_cache:/app/.next/cache
    depends_on:
      database:
        condition: service_healthy
    networks: [proxy, database]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.docker.network: n7-proxy
      traefik.http.routers.n7.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.n7.entrypoints: websecure
      traefik.http.routers.n7.tls.certresolver: le
      traefik.http.services.n7.loadbalancer.server.port: "3000"
      traefik.http.routers.n7.middlewares: n7-headers
      traefik.http.middlewares.n7-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.n7-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.n7-headers.headers.referrerPolicy: strict-origin-when-cross-origin

  email-worker:
    image: ${APP_IMAGE:-ghcr.io/adnanrahim110/n7cosmetics:latest}
    container_name: n7-email-worker
    init: true
    restart: unless-stopped
    env_file: ./app.env
    environment:
      NODE_ENV: production
      DB_HOST: database
      DB_PASSWORD_FILE: /run/secrets/db_password
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
      MEDIA_STORAGE_DIR: /app/media
    secrets: [db_password, app_encryption_key]
    command: [node, .scripts-dist/scripts/email-worker.js]
    depends_on:
      database:
        condition: service_healthy
    networks: [proxy, database]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    stop_grace_period: 90s

  payment-worker:
    extends:
      service: email-worker
    container_name: n7-payment-worker
    command: [node, .scripts-dist/scripts/payment-worker.js]

  database:
    image: mariadb:11.4
    container_name: n7-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: n7cosmetics
      MARIADB_USER: n7cosmetics
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes: [database_data:/var/lib/mysql]
    networks: [database]
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    mem_limit: 2g
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  proxy:
    image: traefik:v3.7
    container_name: n7-proxy
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=n7-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=600s
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certificates:/letsencrypt
    networks: [proxy]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m

networks:
  proxy:
    name: n7-proxy
  database:
    internal: true

volumes:
  database_data:
  next_cache:
  certificates:

secrets:
  db_password:
    file: ./secrets/db_password
  db_root_password:
    file: ./secrets/db_root_password
  app_encryption_key:
    file: ./secrets/app_encryption_key
